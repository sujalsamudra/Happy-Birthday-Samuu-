<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Samuu 💗</title>
    <meta property="og:title" content="Happy Birthday Samuu 💗">
<meta property="og:description" content="A small surprise made with love 🎁✨">
<meta property="og:image" content="https://sujalsamudra.github.io/happy-Birthday-Samuu/Photo.jpg">
<meta property="og:url" content="https://sujalsamudra.github.io/happy-Birthday-Samuu/">
<meta property="og:type" content="website">
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="card">
        <h1>Happy Birthday, Samuu 🎂💗</h1>
        <p class="sub">Hope you like it ✨</p>

        <button onclick="showMessage()">Message for you 🎁</button>

<div id="surprise" style="display:none;">

<img src="Photo 3.jpg" class="Photo">

<p id="messageText"></p>

</div>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup hidden">
        <div class="popup-box">
            <p>You are the most beautiful part of my world 💗</p>
            <button onclick="closePopup()">Close 💖</button>
        </div>
    </div>

    <!-- Music -->
    <audio id="song" src="Song 3.mp3"></audio>

    <script src="script2.js"></script><script>

function showMessage(){

document.getElementById("surprise").style.display="block";

/* play music */
document.getElementById("song").play();

let text = "You are truly sweet , and I just wanted to do something small to make you smile today. I hope this year brings you happiness and everything your heart wishes for 💗 have a good day 🙂";

let i = 0;

function typing(){
if(i < text.length){
document.getElementById("messageText").inner += text.charAt(i);
i++;
setTimeout(typing,40);
}
}

typing();

}

</script>
</body>
</html>
